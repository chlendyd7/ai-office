<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로젝트</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0f1318;--panel:#171c23;--panel2:#1d232c;--line:#2a313c;--text:#e6e9ee;--muted:#8b95a5;
  --accent:#5aa9ff;--ok:#3ecf8e;--warn:#f5b84a;--bad:#ef6b6b;
}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--panel:#fff;--panel2:#f0f3f7;--line:#d9dee6;--text:#1b2230;--muted:#667085;--accent:#1f6fd1;--ok:#14935b;--warn:#b7791f;--bad:#d03b3b;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:18px;align-items:center}
header b{letter-spacing:.2px}header a{color:var(--muted);text-decoration:none}header a:hover{color:var(--text)}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;padding:14px 16px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{resize:vertical;min-height:64px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600}
button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.bad{background:var(--bad)}button.ok{background:var(--ok)}
button.sm{padding:2px 9px;font-size:12px}
.muted{color:var(--muted)}.err{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pj{padding:7px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pj:hover{background:var(--panel2)}.pj.sel{border-color:var(--accent);background:var(--panel2)}
.pj small{display:block;color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);margin-left:4px}
.tag.warn{border-color:var(--warn);color:var(--warn)}.tag.ok{border-color:var(--ok);color:var(--ok)}
.rd{border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.rd.bad{border:1px solid var(--bad)}.rd.warn{border:1px solid var(--warn)}.rd.ok{border:1px solid var(--ok)}
.rd ul{margin:4px 0 0;padding-left:18px}
.dl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel2)}
.dl-head{display:flex;gap:6px;align-items:center}.dl-head .sp{flex:1}
.res{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.res .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res input[type=checkbox]{width:auto}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px 10px;text-align:center;color:var(--muted);cursor:pointer;margin-top:8px}
.drop.over{border-color:var(--accent);background:var(--panel2);color:var(--text)}
.pend{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:12px;background:var(--panel2)}
.pend button{margin:4px 6px 0 0}
.empty{color:var(--muted);padding:40px 10px;text-align:center}
.final{border:1px solid var(--ok);border-radius:8px;padding:8px 10px;margin-top:8px}.ftext{white-space:pre-wrap;margin-top:4px}
.unv{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12px;background:var(--panel2)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:3vh 12px}
.modal[hidden]{display:none}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:min(1080px,100%);height:94vh;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.mhead .sp{flex:1}.mbox iframe{flex:1;border:0;width:100%;background:var(--bg)}
</style>
</head>
<body>
<header><b>프로젝트</b><a href="/office">Office</a><a href="/ops">AI Ops</a><button class="ghost sm" id="open-lib" type="button">📁 자료실</button><span id="hdr-msg" class="muted"></span></header>
<div id="rs-modal" class="modal" hidden><div class="mbox" role="dialog" aria-label="자료실"><div class="mhead"><b>자료실 — 내 리소스</b><span class="sp"></span><span class="muted" style="font-size:12px">올리기 · 붙여넣기 · 글자 확인과 검수 · 삭제</span><button class="ghost sm" id="rs-close" type="button">닫기 (Esc)</button></div><iframe id="rs-frame" title="자료실" src="about:blank"></iframe></div></div>
<main>
  <section>
    <div class="card"><h3>새 프로젝트</h3>
      <label>오피스</label><select id="n-office"></select>
      <div id="n-fields"></div>
      <p style="margin:10px 0 0"><button id="n-create" type="button">만들기</button> <span id="n-err" class="err"></span></p>
    </div>
    <div class="card"><h3>내 프로젝트</h3><div id="list"></div></div>
  </section>
  <section id="detail"><div class="empty">왼쪽에서 프로젝트를 고르거나 새로 만드세요</div></section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString();
async function call(method, path, body) {
  const r = await fetch(path, {method, headers: {'content-type': 'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || r.status));
  return j;
}
let offices = {}, officeKey = '', list = [], view = null, libRes = [], ownRes = [], libPrompts = [], pending = [], reviewing = null;
const office = () => offices[view ? view.project.office : officeKey];

/* ---------- forms generated from the office's declaration ---------- */
function fieldHtml(f, v, pre) {
  const id = `${pre}-${f.name}`, lab = `<label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>`;
  v = v ?? f.default ?? '';
  if (f.type === 'bool') return `<label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="${id}" data-f="${esc(f.name)}" data-bool style="width:auto" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
  if (f.name.startsWith('prompt_')) {  // a library prompt for this agent: the latest version, or one pinned
    const role = f.name.slice(7), mine = libPrompts.filter(p => p.role === role);
    return lab + `<select id="${id}" data-f="${esc(f.name)}"><option value="">내장 기본</option>${mine.map(p => `<option value="${esc(p.name)}" ${v === p.name ? 'selected' : ''}>${esc(p.name)} (최신)</option>`
      + [...p.versions].reverse().map(x => `<option value="${esc(p.name)}@${x.version}" ${v === p.name + '@' + x.version ? 'selected' : ''}>${esc(p.name)}@${x.version}</option>`).join('')).join('')}</select>`;
  }
  if (f.type === 'textarea') return lab + `<textarea id="${id}" data-f="${esc(f.name)}">${esc(v)}</textarea>`;
  if (f.type === 'select') return lab + `<select id="${id}" data-f="${esc(f.name)}">${f.options.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(f.option_labels?.[o] ?? o)}</option>`).join('')}</select>`;
  return lab + `<input id="${id}" data-f="${esc(f.name)}" type="${f.type === 'number' || f.type === 'decimal' ? 'number' : 'text'}" ${f.type === 'number' ? 'min="' + (f.min ?? 1) + '"' : f.type === 'decimal' ? 'step="any"' : ''} value="${esc(v)}">`;
}
const readFields = el => Object.fromEntries([...el.querySelectorAll('[data-f]')].map(e => [e.dataset.f, e.dataset.bool !== undefined ? e.checked : e.value]));
const say = (t, bad) => { $('#hdr-msg').innerHTML = t ? `<span class="${bad ? 'err' : ''}">${esc(t)}</span>` : ''; };

/* ---------- project list and creation ---------- */
function renderNew() {
  const o = offices[$('#n-office').value]; officeKey = o.key;
  $('#n-fields').innerHTML = o.brief_fields.map(f => fieldHtml(f, '', 'n')).join('');
}
async function loadList() {
  list = await call('GET', '/api/projects?office=' + encodeURIComponent(officeKey));
  $('#list').innerHTML = list.length ? list.map(p => `<div class="pj ${view && view.project.id === p.id ? 'sel' : ''}" data-id="${esc(p.id)}"><b>${esc(p.title)}</b>
      <small>문항 ${p.deliverables}개 · 최종본 ${p.finals}개</small></div>`).join('') : '<div class="muted">아직 없습니다</div>';
}
$('#list').onclick = e => { const el = e.target.closest('.pj'); if (el) openProject(el.dataset.id); };
$('#n-office').onchange = renderNew;
$('#n-create').onclick = async () => {
  $('#n-err').textContent = '';
  try {
    const v = await call('POST', '/api/projects', {office: officeKey, brief: readFields($('#n-fields'))});
    renderNew(); await openProject(v.project.id);
  } catch (e) { $('#n-err').textContent = e.message; }
};

/* ---------- one project ---------- */
async function refreshAux() {
  libRes = await call('GET', '/api/library/resources');
  libPrompts = await call('GET', '/api/library/prompts');
  ownRes = await call('GET', '/api/library/resources?owner_project_id=' + view.project.id);
}
async function openProject(id) {
  view = await call('GET', '/api/projects/' + id); pending = []; reviewing = null;
  await refreshAux(); render(); await loadList(); history.replaceState(null, '', '#' + id);
}
async function apply(promise) {  // an action that returns the project view
  try { view = await promise; say(''); await refreshAux(); render(); await loadList(); }
  catch (e) { say(e.message, true); }
}
function render() {
  const el = $('#detail');
  if (!view) { el.innerHTML = '<div class="empty">왼쪽에서 프로젝트를 고르거나 새로 만드세요</div>'; return; }
  const o = office(), p = view.project, rd = view.readiness, labels = o.role_labels;
  const kind = Object.entries(o.deliverable_kinds)[0], kinds = Object.entries(o.deliverable_kinds);
  const attachedIds = new Set(view.resources.map(r => r.id));
  const readiness = rd.blocking.length ? `<div class="rd bad"><b>시작 전에 해결할 것</b><ul>${rd.blocking.map(x => `<li>${esc(x)}</li>`).join('')}</ul>${rd.warnings.length ? `<div class="muted" style="margin-top:6px">참고</div><ul>${rd.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`
    : rd.warnings.length ? `<div class="rd warn"><b>시작할 수 있습니다</b> — 아래는 결과를 약하게 만들 수 있는 점입니다<ul>${rd.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '<div class="rd ok"><b>준비됨</b></div>';
  el.innerHTML = `
    <div class="card"><div style="display:flex;gap:8px;align-items:center"><h3 style="margin:0;flex:1">${esc(o.label)} · 프로젝트</h3>
      <span class="tag">상태: 작성 전</span><button class="ghost sm" data-act="del-project">프로젝트 삭제</button></div>
      <h2 style="margin:6px 0 8px;font-size:18px">${esc(p.title)}</h2>${readiness}
      <div class="muted" style="font-size:12px">문서를 쓰는 단계(조사 → 매칭 → 작성 → 승인)는 다음 단계에서 이 프로젝트에 연결됩니다. 지금은 쓸 재료를 모으는 곳입니다.</div></div>

    <div class="card" id="brief"><h3>기본 정보</h3>${o.brief_fields.map(f => fieldHtml(f, p.brief[f.name], 'b')).join('')}
      <label>메모</label><textarea data-notes>${esc(p.notes)}</textarea>
      <p style="margin:8px 0 0"><button data-act="save-brief">저장</button></p></div>

    <div class="card" id="settings"><h3>에이전트 · 실행 설정</h3>
      <div class="muted" style="font-size:12px">일하는 에이전트: ${o.agents.map(a => esc(a.label)).join(', ')}. 문항 하나를 쓸 때마다 적용됩니다. <b>기본은 무료 가짜 LLM</b>이고, 실제 게이트웨이는 아래에서 직접 고릅니다.</div>
      <div class="row">${o.run_settings_fields.filter(f => f.type !== 'bool').map(f => `<div>${fieldHtml(f, view.settings[f.name], 's')}</div>`).join('')}</div>
      ${o.run_settings_fields.filter(f => f.type === 'bool').map(f => fieldHtml(f, view.settings[f.name], 's')).join('')}
      <p style="margin:8px 0 0"><button data-act="save-settings">설정 저장</button></p></div>

    <div class="card"><h3>자료 — 이 프로젝트가 쓰는 것</h3>
      ${view.resources.length ? view.resources.map(r => `<div class="res"><span class="nm"><b>${esc(r.name)}</b> <span class="tag">${esc(labels[r.role] ?? r.role)}</span>
        ${r.review_status !== 'verified' ? '<span class="tag warn">검수 전</span>' : ''}${r.owner_project_id ? '<span class="tag">이 프로젝트 전용</span>' : ''}</span>
        <span class="muted">${esc(r.source_type)} · ${fmt(r.chars)}자</span><button class="ghost sm" data-act="detach" data-id="${esc(r.id)}">빼기</button></div>`).join('') : '<div class="muted">아직 없습니다</div>'}

      <div id="libsel">${libSelectHtml(o, labels, attachedIds)}</div>

      <h3 style="margin-top:14px">이 프로젝트 전용 자료 추가 <span class="muted" style="text-transform:none">(직무 설명 등 · 붙여넣기 또는 파일·이미지)</span></h3>
      <div class="row"><div><label>역할</label><select id="own-role">${o.resource_roles.map(r => `<option value="${esc(r)}" ${r === o.default_own_role ? 'selected' : ''}>${esc(labels[r])}</option>`).join('')}</select></div>
        <div><label>이름</label><input id="own-name" placeholder="예: 직무 설명"></div></div>
      <textarea id="own-text" placeholder="텍스트를 붙여넣기" style="margin-top:6px"></textarea>
      <p style="margin:6px 0 0"><button class="ghost" data-act="paste">붙여넣은 글 추가</button></p>
      <div id="drop" class="drop">PDF · 이미지 · TXT · MD 파일을 끌어다 놓거나 <u>클릭해서 고르기</u><input id="file" type="file" multiple style="display:none" accept=".pdf,.txt,.md,.markdown,.png,.jpg,.jpeg,.webp,.gif"></div>
      <div id="own-msg" class="muted" style="font-size:12px;margin-top:6px"></div>
      <p style="margin:10px 0 0"><button class="ghost" data-act="research">🔎 회사 조사 (웹 검색)</button>
        <span class="muted" style="font-size:12px">${esc(view.project.brief.company || '회사')}를 검색해서 출처가 붙은 조사 글을 만듭니다 · 검색 ${view.settings.research_searches}회까지(1회 ≈ 입력 약 1.9만 토큰) · 결과는 <b>검수 전</b>으로 저장되고 출처를 확인해야 씁니다</span></p>
      <div id="pending"></div>
      ${renderOwn(labels)}
    </div>

    <div class="card" id="dels"><h3>${esc(kinds.length === 1 ? kind[1].label : '산출물')} (${view.deliverables.length})</h3>
      ${view.deliverables.map((d, i) => renderDeliverable(d, i, o)).join('') || '<div class="muted">아직 없습니다</div>'}
      <div style="margin-top:10px">${kinds.length > 1 ? `<select id="d-kind">${kinds.map(([k, v]) => `<option value="${esc(k)}">${esc(v.label)}</option>`).join('')}</select>` : ''}
        <label>새 ${esc(kind[1].label)} 원문</label><textarea id="d-new" placeholder="예: 지원동기를 서술하시오 (800자 이내)"></textarea>
        <p style="margin:6px 0 0"><button data-act="d-add">추가</button></p></div></div>`;
  renderPending();
}
function libSelectHtml(o, labels, attachedIds) {
  return `<h3 style="margin-top:14px">내 라이브러리에서 고르기 <span class="muted" style="text-transform:none">(검수 완료된 자료만)</span>
      <button class="ghost sm" data-act="open-library" style="float:right;text-transform:none">자료실 열기 — 올리기 · 붙여넣기 · 확인</button></h3>
    <div class="row"><div><label>붙일 때의 역할</label><select id="lib-role">${o.resource_roles.map(r => `<option value="${esc(r)}" ${r === o.default_library_role ? 'selected' : ''}>${esc(labels[r])}</option>`).join('')}</select></div></div>
    ${libRes.length ? libRes.map(r => `<div class="res"><input type="checkbox" data-act="toggle" data-id="${esc(r.id)}" ${attachedIds.has(r.id) ? 'checked' : ''} ${r.review_status !== 'verified' ? 'disabled' : ''}>
      <span class="nm">${esc(r.name)} ${r.review_status !== 'verified' ? '<span class="tag warn">검수 전 — 자료실에서 확인 필요</span>' : ''}</span>
      <span class="muted">${esc(r.source_type)} · ${fmt(r.chars)}자</span></div>`).join('') : '<div class="muted">자료실이 비어 있습니다. 위의 <b>자료실</b>에서 이력서·경험 정리를 올리거나 붙여넣으세요.</div>'}`;
}
async function refreshLibSelect() {  // after the popup closes: only the picker is redrawn, so nothing typed in the forms is lost
  libRes = await call('GET', '/api/library/resources');
  const box = $('#libsel'); if (!box || !view) return;
  const o = office(), attached = new Set(view.resources.map(r => r.id));
  box.innerHTML = libSelectHtml(o, o.role_labels, attached);
}
function renderDeliverable(d, i, o) {
  const kind = o.deliverable_kinds[d.kind];
  return `<div class="dl" data-id="${esc(d.id)}"><div class="dl-head"><b>${i + 1}.</b><span class="tag">${esc(kind ? kind.label : d.kind)}</span><span class="sp"></span>
      <button class="ghost sm" data-act="d-up" ${i === 0 ? 'disabled' : ''}>↑</button><button class="ghost sm" data-act="d-down" ${i === view.deliverables.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="ghost sm" data-act="d-del">삭제</button></div>
    <label>원문</label><textarea data-f="title">${esc(d.title)}</textarea>
    <div class="row">${(kind ? kind.spec_fields : []).filter(f => f.type !== 'textarea').map(f => `<div>${fieldHtml(f, d.spec[f.name], 'd' + d.id)}</div>`).join('')}</div>
    ${(kind ? kind.spec_fields : []).filter(f => f.type === 'textarea').map(f => fieldHtml(f, d.spec[f.name], 'd' + d.id)).join('')}
    <p style="margin:8px 0 0"><button class="sm" data-act="d-save">저장</button> <button class="sm ok" data-act="d-draft">초안 작성 시작</button></p>
    <div class="runs" data-did="${esc(d.id)}">${runsHtml(d)}</div></div>`;
}
const RUN_STATUS = {running: '작성 중', awaiting_approval: '승인 대기', approved: '승인됨', rejected: '반려됨', failed: '실패'};
const STOP = {passed: '기준 통과', max_rounds: '라운드 상한', budget_exceeded: '예산 도달', step: '라운드 완료'};
const BLOCK = {facts: '근거에 없는 수치·용어', length: '글자 수 초과'};
function runsHtml(d) {  // the approved final, then the runs (newest first): what happened and why a high score did not pass
  const rs = (view.runs && view.runs[d.id]) || [], m = d.final_meta || {};
  const fin = d.final_content ? `<div class="final"><b>승인된 최종본</b> <span class="tag ok">${m.chars ?? '?'}자${m.max_chars ? ' / 제한 ' + m.max_chars + '자' : ''}${m.count_mode === 'without_spaces' ? ' · 공백 제외' : ''}${m.within_limit === false ? ' · ⚠ 제한 초과' : ''}</span><div class="ftext">${esc(d.final_content)}</div></div>` : '';
  const rows = rs.map(r => `<div class="res"><span class="nm">${RUN_STATUS[r.status] || r.status}${r.stop_reason ? ' · ' + (STOP[r.stop_reason] || r.stop_reason) : ''}${r.score != null ? ` · ${r.score}점` : ''}${r.blocked_by.length ? ' · ⚠ ' + r.blocked_by.map(b => BLOCK[b] || b).join(', ') : ''}${r.error ? ' · ' + esc(r.error) : ''}</span>
    <span class="muted">${r.rounds}라운드 · $${r.cost_usd.toFixed(4)}</span><a href="/ops#${esc(r.run_id)}" target="_blank" style="color:var(--accent)">Ops</a></div>`).join('');
  const wait = rs.some(r => r.status === 'awaiting_approval') ? '<div class="muted" style="font-size:12px">승인·수정 요청·반려는 <a href="/office" target="_blank" style="color:var(--accent)">Office</a>나 Ops에서 합니다. 승인하면 위의 최종본이 됩니다.</div>' : '';
  return fin + rows + wait;
}
function refreshRuns() { document.querySelectorAll('.runs[data-did]').forEach(el => { const d = view.deliverables.find(x => x.id === el.dataset.did); if (d) el.innerHTML = runsHtml(d); }); }
setInterval(async () => {  // while something is being written or waits for a decision, keep the status current (without redrawing the forms)
  if (!view || !Object.values(view.runs || {}).flat().some(r => r.status === 'running' || r.status === 'awaiting_approval')) return;
  try { view = await call('GET', '/api/projects/' + view.project.id); refreshRuns(); } catch (e) { /* the next tick tries again */ }
}, 2500);
function renderOwn(labels) {  // what belongs to this project alone: including text that still waits for a human check
  const mine = ownRes;
  if (!mine.length) return '';
  const attached = new Set(view.resources.map(r => r.id));
  return `<h3 style="margin-top:14px">이 프로젝트 전용 자료 관리</h3>` + mine.map(r => `<div class="res"><span class="nm"><b>${esc(r.name)}</b>
      ${r.review_status !== 'verified' ? '<span class="tag warn">검수 전</span>' : attached.has(r.id) ? '<span class="tag ok">사용 중</span>' : '<span class="tag">안 쓰는 중</span>'}</span>
      <span class="muted">${esc(r.source_type)} · ${fmt(r.chars)}자${r.source_type === 'research' ? ' · 웹 검색' : r.converted_by !== 'text' ? ' · LLM 변환' : ''}</span>
      <button class="ghost sm" data-act="review" data-id="${esc(r.id)}">내용 확인</button><button class="ghost sm" data-act="own-del" data-id="${esc(r.id)}">삭제</button></div>
      ${reviewing && reviewing.id === r.id ? `<div class="unv">${r.review_status !== 'verified' ? (r.source_type === 'research'
          ? '<b>⚠ 검수 전</b> — 웹 검색으로 만든 조사 글입니다. 문장 뒤의 [번호]는 맨 아래 출처 목록의 페이지입니다. <b>번호가 없는 문장은 근거가 없는 것</b>이니 주소를 열어 사실인지 확인하고, 틀린 곳은 고친 뒤 <b>검수 완료</b>를 누르면 프로젝트 자료가 됩니다.'
          : '<b>⚠ 검수 전</b> — 원본 파일과 대조해 틀린 곳을 고친 뒤 <b>검수 완료</b>를 누르면 프로젝트 자료가 됩니다.') : '내용을 고칠 수 있습니다.'}
        <textarea id="rv-text" style="min-height:200px;margin-top:6px">${esc(reviewing.text)}</textarea>
        <p style="margin:6px 0 0"><button class="sm ghost" data-act="rv-save" data-id="${esc(r.id)}">고친 내용 저장</button>
        ${r.review_status !== 'verified' ? `<button class="sm ok" data-act="rv-verify" data-id="${esc(r.id)}">검수 완료</button>` : ''}</p></div>` : ''}`).join('');
}

/* ---------- actions ---------- */
const readB64 = f => new Promise((ok, no) => { const rd = new FileReader(); rd.onload = () => ok(String(rd.result).split(',')[1]); rd.onerror = () => no(rd.error); rd.readAsDataURL(f); });
const PAGE_WHY = {empty: '글자 없음', garbled: '글자 깨짐', image: '이미지'};
function renderPending() {
  const el = $('#pending'); if (!el) return;
  el.innerHTML = pending.map((p, i) => {
    const bad = Object.entries(p.info.pages).filter(([s, ns]) => s !== 'ok' && ns.length).map(([s, ns]) => `${ns.join(', ')}쪽(${PAGE_WHY[s]})`).join(' · ');
    return `<div class="pend"><b>${esc(p.file.name)}</b> — ${p.info.kind === 'image' ? '이미지는 글자 층이 없어' : esc(bad) + '은(는) 글자를 읽을 수 없어'} 모델로 변환해야 합니다.
      <div class="muted">변환할 쪽만 보내며 비용은 최대 약 $${p.info.max_usd} (모델 ${esc(p.info.model)}). 결과는 <b>검수 전</b>으로 저장되고, 직접 확인해야 이 프로젝트의 자료가 됩니다.</div>
      <button class="sm" data-act="p-llm" data-i="${i}">LLM으로 변환</button>${p.info.can_skip ? `<button class="ghost sm" data-act="p-skip" data-i="${i}">글자 있는 쪽만 저장</button>` : ''}<button class="ghost sm" data-act="p-cancel" data-i="${i}">취소</button></div>`;
  }).join('');
}
async function sendOwn(file, role, onBad) {
  const r = await call('POST', `/api/projects/${view.project.id}/resources/upload`, {filename: file.name, data: await readB64(file), role, on_bad_pages: onBad});
  if (r.needs_conversion) { pending.push({file, role, info: r}); return `${file.name}: 변환 여부를 정해 주세요`; }
  return `✔ ${file.name} → ${fmt(r.chars)}자${r.attached ? ' (프로젝트 자료로 추가됨)' : ' — 검수 전: 아래 "전용 자료 관리"에서 확인 후 검수 완료'}${r.warnings.length ? ' ⚠ ' + r.warnings.join('; ') : ''}`;
}
async function uploadFiles(files) {
  const role = $('#own-role').value, msgs = [];
  for (const f of files) { try { msgs.push(await sendOwn(f, role, 'ask')); } catch (e) { msgs.push(`✘ ${f.name}: ${e.message}`); } }
  await finishUpload(msgs);
}
async function finishUpload(msgs) {
  view = await call('GET', '/api/projects/' + view.project.id); await refreshAux(); render(); await loadList();
  if ($('#own-msg')) $('#own-msg').innerHTML = msgs.map(esc).join('<br>');
}
$('#detail').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b && e.target.closest('#drop')) return $('#file').click(); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, card = b.closest('.dl'), pid = view && view.project.id;
  try {
    if (act === 'toggle') return;  // handled on change
    if (act === 'save-brief') return apply(call('PUT', '/api/projects/' + pid, {brief: readFields($('#brief')), notes: $('#brief [data-notes]').value}));
    if (act === 'del-project') {
      if (!confirm(`"${view.project.title}" 프로젝트를 삭제할까요?\n문항, 자료 연결, 이 프로젝트 전용 자료가 함께 지워집니다. (내 라이브러리 자료와 실행 기록은 그대로)`)) return;
      await call('DELETE', '/api/projects/' + pid); view = null; await loadList(); return render();
    }
    if (act === 'open-library') return openLibrary();
    if (act === 'research') {
      const st = view.settings;
      if (st.mode === 'hchat' && !confirm('웹 검색은 비용이 듭니다. 모델 ' + st.model_researcher + ' · 검색 ' + st.research_searches + '회까지 (검색 1회 ≈ 입력 약 1.9만 토큰) · 예산 최대 $' + st.research_budget_usd + ' . 시작할까요?')) return;
      say('회사를 조사하는 중입니다… (수십 초)');
      const r = await call('POST', `/api/projects/${pid}/research`, {confirm_real: st.mode === 'hchat'});
      view = await call('GET', '/api/projects/' + pid); await refreshAux();
      reviewing = {id: r.resource_id, text: (await call('GET', '/api/library/resources/' + r.resource_id)).text};  // open it for reading right away
      render(); await loadList();
      say(`조사 완료: 검색 ${r.searches}회 · 출처 ${r.sources}개(인용된 것 ${r.cited_sources}개) · $${r.cost_usd.toFixed(4)}${r.warnings.length ? ' ⚠ ' + r.warnings.join(' / ') : ''} — 아래 "전용 자료 관리"에서 읽고 검수하세요`);
      return;
    }
    if (act === 'save-settings') return apply(call('PUT', '/api/projects/' + pid, {settings: readFields($('#settings'))}));
    if (act === 'd-draft') {
      const st = view.settings;
      if (st.mode === 'hchat' && !confirm('실제 게이트웨이로 호출합니다 (과금). 문항 하나 예산 최대 $' + st.budget_usd + ' · 모델: 작성 ' + st.model_writer + ' / 심사 ' + st.model_reviewer + ' . 시작할까요?')) return;
      const r = await call('POST', `/api/projects/${pid}/deliverables/${card.dataset.id}/draft`, {confirm_real: st.mode === 'hchat'});
      say(`작성을 시작했습니다 (${r.mode === 'hchat' ? '실제' : '가짜'} LLM, 예산 $${r.budget_usd})`);
      view = await call('GET', '/api/projects/' + pid); return refreshRuns();
    }
    if (act === 'detach') return apply(call('DELETE', `/api/projects/${pid}/resources/${id}`));
    if (act === 'paste') return apply(call('POST', `/api/projects/${pid}/resources/paste`, {name: $('#own-name').value, text: $('#own-text').value, role: $('#own-role').value}));
    if (act === 'd-add') return apply(call('POST', `/api/projects/${pid}/deliverables`, {kind: $('#d-kind') ? $('#d-kind').value : Object.keys(office().deliverable_kinds)[0], title: $('#d-new').value}));
    if (act === 'd-save') { const f = readFields(card), title = f.title; delete f.title; return apply(call('PUT', '/api/deliverables/' + card.dataset.id, {title, spec: f})); }
    if (act === 'd-del') { if (confirm('이 항목을 삭제할까요?')) return apply(call('DELETE', '/api/deliverables/' + card.dataset.id)); return; }
    if (act === 'd-up' || act === 'd-down') {
      const ids = view.deliverables.map(d => d.id), i = ids.indexOf(card.dataset.id), j = i + (act === 'd-up' ? -1 : 1);
      [ids[i], ids[j]] = [ids[j], ids[i]]; return apply(call('POST', `/api/projects/${pid}/deliverables/order`, {ids}));
    }
    if (act === 'p-cancel') { pending.splice(+b.dataset.i, 1); return renderPending(); }
    if (act === 'p-llm' || act === 'p-skip') {
      const [p] = pending.splice(+b.dataset.i, 1); renderPending();
      $('#own-msg').textContent = act === 'p-llm' ? `${p.file.name}: LLM으로 변환하는 중… (몇 초~수십 초)` : '';
      let msg; try { msg = await sendOwn(p.file, p.role, act === 'p-llm' ? 'llm' : 'skip'); } catch (err) { msg = `✘ ${p.file.name}: ${err.message}`; }
      return finishUpload([msg]);
    }
    if (act === 'review') { reviewing = reviewing && reviewing.id === id ? null : {id, text: (await call('GET', '/api/library/resources/' + id)).text}; return render(); }
    if (act === 'rv-save' || act === 'rv-verify') {
      await call('PUT', '/api/library/resources/' + id, act === 'rv-verify' ? {text: $('#rv-text').value, verified: true} : {text: $('#rv-text').value});
      reviewing = null; return apply(call('GET', '/api/projects/' + pid));
    }
    if (act === 'own-del') {
      if (!confirm('이 전용 자료를 삭제할까요?')) return;
      await call('DELETE', `/api/projects/${pid}/resources/${id}`); await call('DELETE', '/api/library/resources/' + id);
      return apply(call('GET', '/api/projects/' + pid));
    }
  } catch (err) { say(err.message, true); }
});
$('#detail').addEventListener('change', e => {
  const b = e.target.closest('[data-act=toggle]'); if (b) {
    const pid = view.project.id, id = b.dataset.id;
    apply(b.checked ? call('POST', `/api/projects/${pid}/resources`, {resource_id: id, role: $('#lib-role').value}) : call('DELETE', `/api/projects/${pid}/resources/${id}`));
    return;
  }
  if (e.target.id === 'file') { uploadFiles([...e.target.files]); e.target.value = ''; }
});
['dragenter', 'dragover'].forEach(ev => $('#detail').addEventListener(ev, e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => $('#detail').addEventListener(ev, e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); } }));
$('#detail').addEventListener('drop', e => { if (e.target.closest('#drop')) uploadFiles([...e.dataTransfer.files]); });

/* ---------- the 자료실 popup: my resources, managed in /resources ---------- */
const libOpen = () => !$('#rs-modal').hidden;
function openLibrary() { $('#rs-frame').src = '/resources'; $('#rs-modal').hidden = false; }
async function closeLibrary() {
  if (!libOpen()) return;
  $('#rs-modal').hidden = true; $('#rs-frame').src = 'about:blank';
  try { await refreshLibSelect(); } catch (e) { say(e.message, true); }
}
$('#open-lib').onclick = openLibrary;
$('#rs-close').onclick = closeLibrary;
$('#rs-modal').addEventListener('mousedown', e => { if (e.target.id === 'rs-modal') closeLibrary(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && libOpen()) closeLibrary(); });
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.aiops === 'close') closeLibrary(); });

/* ---------- start ---------- */
(async () => {
  offices = await call('GET', '/api/offices');
  $('#n-office').innerHTML = Object.values(offices).map(o => `<option value="${esc(o.key)}">${esc(o.label)}</option>`).join('');
  renderNew(); await loadList();
  if (location.hash.length > 1) openProject(decodeURIComponent(location.hash.slice(1))).catch(() => {});
})().catch(e => say(e.message, true));
addEventListener('hashchange', () => { if (location.hash.length > 1) openProject(decodeURIComponent(location.hash.slice(1))).catch(e => say(e.message, true)); });  // a link to #<project> works on an open page too
</script>
</body>
