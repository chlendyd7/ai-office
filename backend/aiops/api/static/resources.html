<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자료실</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0f1318;--panel:#171c23;--panel2:#1d232c;--line:#2a313c;--text:#e6e9ee;--muted:#8b95a5;--accent:#5aa9ff;--ok:#3ecf8e;--warn:#f5b84a;--bad:#ef6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--panel:#fff;--panel2:#f0f3f7;--line:#d9dee6;--text:#1b2230;--muted:#667085;--accent:#1f6fd1;--ok:#14935b;--warn:#b7791f;--bad:#d03b3b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
button,input,textarea{font:inherit;color:inherit}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;padding:14px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{resize:vertical;min-height:70px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600}
button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.ok{background:var(--ok)}button.sm{padding:3px 10px;font-size:12px}
.muted{color:var(--muted)}.err{color:var(--bad)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px;color:var(--muted);margin-left:4px}
.tag.warn{border-color:var(--warn);color:var(--warn)}.tag.ok{border-color:var(--ok);color:var(--ok)}
.it{padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.it:hover{background:var(--panel2)}.it.sel{border-color:var(--accent);background:var(--panel2)}
.it small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:10px;padding:20px 10px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--panel2);color:var(--text)}
.pend{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:12px;background:var(--panel2)}
.pend button{margin:4px 6px 0 0}
.unv{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px;background:var(--panel2)}
</style>
</head>
<body>
<main>
  <section>
    <div class="card"><h3>올리기</h3>
      <div id="drop" class="drop">PDF · 이미지 · TXT · MD 파일을 여기로 끌어다 놓거나 <u>클릭해서 고르기</u>
        <input id="file" type="file" multiple accept=".pdf,.txt,.md,.markdown,.png,.jpg,.jpeg,.webp,.gif" style="display:none"></div>
      <div id="msg" class="muted" style="font-size:12px;margin:6px 0"></div>
      <div id="pending"></div>
      <h3 style="margin-top:12px">붙여넣어 추가</h3>
      <label>이름</label><input id="p-name" placeholder="예: 프로젝트 경험 정리">
      <textarea id="p-text" style="min-height:110px" placeholder="이력서·경험 정리 같은 글을 붙여넣기"></textarea>
      <p style="margin:6px 0 0"><button class="ghost" id="p-add" type="button">추가</button> <span id="p-err" class="err" style="font-size:12px"></span></p>
    </div>
    <div class="card"><h3>내 자료 <span id="count" class="muted"></span></h3><div id="list" style="max-height:46vh;overflow:auto"></div></div>
  </section>
  <section>
    <div class="card"><h3>내용 확인 · 교정</h3>
      <div id="empty" class="muted" style="font-size:12px">왼쪽에서 자료를 고르세요.</div>
      <div id="edit" hidden>
        <div id="review"></div>
        <div class="muted" style="font-size:12px;margin-bottom:4px">글자를 읽고 틀린 곳을 고치세요. <b>이 글자가 자소서의 근거로 쓰입니다.</b></div>
        <label>이름</label><input id="e-name">
        <label>내용 <span id="e-info" class="muted"></span></label><textarea id="e-text" style="min-height:300px;font:12px/1.55 ui-monospace,Consolas,monospace"></textarea>
        <p style="margin:8px 0 0"><button id="e-save" type="button">저장</button> <button class="ghost" id="e-del" type="button">삭제</button></p>
      </div>
      <div id="err" class="err" style="font-size:12px;margin-top:4px"></div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString();
const tokens = chars => Math.ceil(chars / 2);  // rough: the "2 characters per token" worst case the budget guard uses
async function call(method, path, body) {
  const r = await fetch(path, {method, headers: {'content-type': 'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || r.status));
  return j;
}
let resources = [], rsId = '', pending = [], last;
const showErr = e => { $('#err').textContent = e ? e.message : ''; };

async function load(keep) {
  resources = await call('GET', '/api/library/resources');
  if (keep !== undefined) rsId = keep;
  if (!resources.some(r => r.id === rsId)) rsId = '';
  $('#count').textContent = `(${resources.length}건)`;
  $('#list').innerHTML = resources.length ? resources.map(r => `<div class="it ${r.id === rsId ? 'sel' : ''}" data-id="${esc(r.id)}"><b>${esc(r.name)}</b>
      ${r.review_status === 'unverified' ? '<span class="tag warn">⚠ 검수 전</span>' : r.converted_by !== 'text' ? '<span class="tag ok">검수 완료</span>' : ''}
      <small>${esc(r.source_type.toUpperCase())}${r.pages ? ` · ${r.pages}쪽` : ''} · ${fmt(r.chars)}자 (≈${fmt(tokens(r.chars))} 토큰)${r.converted_by !== 'text' ? ' · LLM 변환' : ''}${r.source_name ? ' · ' + esc(r.source_name) : ''}</small></div>`).join('')
    : '<div class="muted">아직 없습니다. 위에서 올리거나 붙여넣으세요.</div>';
  await show();
}
async function show() {
  $('#edit').hidden = !rsId; $('#empty').hidden = !!rsId;
  if (!rsId) return;
  const r = await call('GET', '/api/library/resources/' + rsId);
  $('#e-name').value = r.name; $('#e-text').value = r.text; info();
  const run = r.convert_run_id ? ` <a href="/ops#${esc(r.convert_run_id)}" target="_blank" style="color:var(--accent)">변환 기록(비용)</a>` : '';
  $('#review').innerHTML = r.review_status === 'unverified'
    ? `<div class="unv"><b>⚠ 검수 전 — LLM이 ${r.converted_by === 'mixed' ? '일부 쪽을 ' : ''}변환한 글자입니다.</b> 원본 파일과 나란히 놓고 숫자·이름·날짜가 맞는지 읽어 보고, 틀린 곳은 아래에서 고친 뒤 <b>검수 완료</b>를 누르세요.
       검수 전에는 자소서의 근거로 쓸 수 없습니다.${run}<div style="margin-top:6px"><button class="ok sm" id="verify" type="button">검수 완료로 표시</button></div></div>`
    : r.converted_by !== 'text' ? `<div class="muted" style="font-size:12px;margin-bottom:6px">LLM 변환 · 검수 완료 <button class="ghost sm" id="unverify" type="button">검수 취소</button>${run}</div>` : '';
}
const info = () => { const n = $('#e-text').value.trim().length; $('#e-info').textContent = `(${fmt(n)}자 · 호출마다 입력에 들어가면 ≈${fmt(tokens(n))} 토큰씩 비용이 붙음)`; };
$('#e-text').addEventListener('input', info);
$('#list').onclick = e => { const el = e.target.closest('.it'); if (el) { rsId = el.dataset.id; showErr(); load(rsId); } };

/* ---- upload: a file is read for free where it has text; otherwise the user is asked before a model is used ---- */
const b64 = f => new Promise((ok, no) => { const rd = new FileReader(); rd.onload = () => ok(String(rd.result).split(',')[1]); rd.onerror = () => no(rd.error); rd.readAsDataURL(f); });
const WHY = {empty: '글자 없음', garbled: '글자 깨짐', image: '이미지'};
async function send(f, onBad) {  // -> a status line, or null when the file waits for a decision
  try {
    if (f.size > 10 * 1024 * 1024) throw new Error('파일이 너무 큽니다 (최대 10MB)');
    const r = await call('POST', '/api/library/resources/upload', {filename: f.name, data: await b64(f), on_bad_pages: onBad});
    if (r.needs_conversion) { pending.push({file: f, info: r}); return null; }
    last = r.id;
    return `✔ ${f.name} → ${fmt(r.chars)}자${r.pages ? `, ${r.pages}쪽` : ''}${r.converted_by === 'text' ? '' : ` · LLM 변환 (비용 $${r.cost_usd}) — 검수 전`}${r.warnings.length ? ' ⚠ ' + r.warnings.join('; ') : ''}`;
  } catch (e) { return `✘ ${f.name}: ${e.message}`; }
}
function renderPending() {
  $('#pending').innerHTML = pending.map((p, i) => {
    const bad = Object.entries(p.info.pages).filter(([s, ns]) => s !== 'ok' && ns.length).map(([s, ns]) => `${ns.join(', ')}쪽(${WHY[s]})`).join(' · ');
    return `<div class="pend"><b>${esc(p.file.name)}</b> — ${p.info.kind === 'image' ? '이미지는 글자 층이 없어' : esc(bad) + '은(는) 글자를 읽을 수 없어'} 모델로 변환해야 합니다.
      <div class="muted">변환할 쪽만 보내며 비용은 최대 약 $${p.info.max_usd} (모델 ${esc(p.info.model)}). 결과는 <b>검수 전</b>으로 저장되고 직접 확인해야 근거로 쓸 수 있습니다.</div>
      <button class="sm" data-act="llm" data-i="${i}">LLM으로 변환</button>${p.info.can_skip ? `<button class="ghost sm" data-act="skip" data-i="${i}">글자 있는 쪽만 저장</button>` : ''}<button class="ghost sm" data-act="cancel" data-i="${i}">취소</button></div>`;
  }).join('');
}
async function upload(files) {
  last = undefined;
  const lines = (await Promise.all(files.map(f => send(f, 'ask')))).filter(Boolean);
  $('#msg').innerHTML = lines.map(esc).join('<br>'); showErr(); renderPending(); await load(last);
}
$('#pending').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const [p] = pending.splice(+b.dataset.i, 1); renderPending();
  if (b.dataset.act === 'cancel') return;
  $('#msg').textContent = b.dataset.act === 'llm' ? `${p.file.name}: LLM으로 변환하는 중… (몇 초~수십 초)` : '';
  last = undefined;
  $('#msg').textContent = (await send(p.file, b.dataset.act)) || ''; renderPending(); await load(last);
};
$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
['dragenter', 'dragover'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', e => upload([...e.dataTransfer.files]));

/* ---- paste, correct, check, delete ---- */
$('#p-add').onclick = async () => {
  $('#p-err').textContent = '';
  try {
    const {id} = await call('POST', '/api/library/resources', {name: $('#p-name').value, text: $('#p-text').value});
    $('#p-name').value = ''; $('#p-text').value = ''; $('#msg').textContent = '붙여넣은 글을 추가했습니다'; await load(id);
  } catch (e) { $('#p-err').textContent = e.message; }
};
$('#e-save').onclick = async () => {
  try { await call('PUT', '/api/library/resources/' + rsId, {name: $('#e-name').value, text: $('#e-text').value}); showErr(); $('#msg').textContent = '저장됨'; await load(rsId); }
  catch (e) { showErr(e); }
};
$('#e-del').onclick = async () => {
  const r = resources.find(x => x.id === rsId);
  if (!r || !confirm(`"${r.name}" 자료를 삭제할까요? (이미 시작한 작업은 자기 복사본을 가지고 있어 영향 없음)`)) return;
  try { await call('DELETE', '/api/library/resources/' + rsId); showErr(); await load(''); } catch (e) { showErr(e); }  // refused while a project uses it, with the projects named
};
$('#review').onclick = async e => {
  const verified = e.target.id === 'verify' ? true : e.target.id === 'unverify' ? false : null;
  if (verified === null) return;
  try { await call('PUT', '/api/library/resources/' + rsId, {verified}); showErr(); await load(rsId); } catch (err) { showErr(err); }
};

// embedded in a popup, keyboard focus lives in this frame: forward Esc so the page around it can close the popup
addEventListener('keydown', e => {
  if (e.key === 'Escape' && window.parent !== window && !e.target.closest('textarea,input')) parent.postMessage({aiops: 'close'}, location.origin);
});
load().catch(e => showErr(e));
</script>
</body>
</html>
